<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account Management — EduHubSpot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#2563EB; --blue-dark:#1D4ED8; --blue-soft:#EFF4FF; --blue-line:#DBE5FF;
  --ink:#111827; --ink2:#374151; --muted:#6B7280; --faint:#9CA3AF;
  --line:#E5E7EB; --line2:#F3F4F6; --bg:#FFFFFF; --soft:#F9FAFB; --canvas:#F7F8FA;
  --red:#DC2626; --red-soft:#FEF2F2;
  --amber:#D97706; --amber-soft:#FFFBEB;
  --green:#059669; --green-soft:#ECFDF5;
  /* data ramp */
  --d1:#2563EB; --d2:#7DA2F5; --d3:#C3D4FB; --d4:#E8EEFC;
  --accent:#2563EB; --accent-ink:#1D4ED8; --accent-soft:#EFF4FF;
  --pos:#059669; --pos-soft:#ECFDF5;
  --cau:#D97706; --cau-soft:#FFFBEB;
  --neg:#DC2626; --neg-soft:#FEF2F2;
  --brand:#2563EB; --brand-ink:#1D4ED8; --brand-soft:#EFF4FF;
  --good:#059669; --good-soft:#ECFDF5;
  --warn:#D97706; --warn-soft:#FFFBEB;
  --bad:#DC2626; --bad-soft:#FEF2F2;
  --gold:#7DA2F5; --gold-soft:#EFF4FF;
  --surface:#FFFFFF; --rail:#F9FAFB;
  --r:12px; --r-sm:8px; --nav-w:240px;
  --shadow-sm:0 1px 2px rgba(16,24,40,.05);
  --shadow-lg:0 12px 32px rgba(16,24,40,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);
  font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
.num,.kpi-val,td.n,th.n,.v,.mini-kpi .v{font-variant-numeric:tabular-nums}
h1,h2,h3{letter-spacing:-.015em}
button{font-family:inherit;cursor:pointer}
a{color:var(--blue);text-decoration:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ---------- gate ---------- */
.gate{position:fixed;inset:0;background:var(--canvas);display:flex;align-items:center;justify-content:center;padding:24px;z-index:5}
.gate-card{width:min(560px,100%);background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px;box-shadow:var(--shadow-sm)}
.gate-h{display:flex;align-items:center;gap:11px;margin-bottom:20px}
.gate-h h1{font-size:16px;font-weight:600}
.gate-h .sub{font-size:12.5px;color:var(--faint);margin-top:1px}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:36px 20px;text-align:center;cursor:pointer;
  transition:border-color .15s,background .15s;background:var(--soft)}
.drop:hover,.drop.over,.drop:focus-visible{border-color:var(--blue);background:var(--blue-soft)}
.drop-ico{width:36px;height:36px;border-radius:50%;background:#fff;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;margin:0 auto 10px;color:var(--blue);font-size:16px;font-weight:600}
.drop-t{font-size:14px;font-weight:600}
.drop-s{font-size:12.5px;color:var(--muted);margin-top:3px}
.gate-msg{display:none;margin-top:14px;padding:11px 13px;border-radius:8px;font-size:12.5px;border-left:3px solid}
.gate-msg.bad{background:var(--red-soft);border-color:var(--red);color:var(--ink2)}
.gate-msg.busy{background:var(--blue-soft);border-color:var(--blue);color:var(--ink2)}
.gate-detail{color:var(--muted);margin-top:4px;font-size:11.5px;word-break:break-word;max-height:70px;overflow:auto}
.gate-spec{margin-top:20px;border-top:1px solid var(--line2);padding-top:14px}
.gate-spec-t{font-size:11.5px;font-weight:600;color:var(--ink2)}
.gate-cols{font-size:11.5px;color:var(--faint);margin-top:5px;line-height:1.6}
.gate-note{font-size:11.5px;color:var(--muted);margin-top:10px}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,14px);background:var(--ink);color:#fff;
  font-size:12.5px;padding:10px 15px;border-radius:8px;opacity:0;pointer-events:none;transition:.2s;z-index:80;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- top bar ---------- */
.shell{display:flex;flex-direction:column;min-height:100vh}
.topnav{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;
  padding:0 20px;gap:14px;position:-webkit-sticky;position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;letter-spacing:-.02em}
.logo-mark{height:26px;flex:none;display:flex;align-items:center;justify-content:center}
.logo-mark img{height:26px;width:auto}
.logo-img{height:22px;width:auto;display:block}
.logo .edu{color:var(--ink)} .logo .hub{color:var(--blue)} .logo .spot{color:var(--ink)}
.topnav-right{margin-left:auto;display:flex;align-items:center;gap:16px}
.topmeta{display:flex;gap:16px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.topmeta b{color:var(--ink2);font-weight:600;font-variant-numeric:tabular-nums}
.hdr-act{display:flex;gap:6px}

/* ---------- body / nav ---------- */
.bodywrap{display:grid;grid-template-columns:var(--nav-w) minmax(0,1fr);flex:1;min-height:0}

/* ---------- left nav ---------- */
.nav{background:#fff;border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:-webkit-sticky;position:sticky;top:58px;height:calc(100vh - 58px);align-self:start;min-width:0}
.bodywrap.nav-collapsed{grid-template-columns:56px minmax(0,1fr)}
.bodywrap.nav-collapsed .nav{overflow:hidden}
.bodywrap.nav-collapsed .nav-brand{justify-content:center;padding:14px 0}
.bodywrap.nav-collapsed .nav-brand .nb-mark,.bodywrap.nav-collapsed .nav-title{display:none}
.bodywrap.nav-collapsed .nav-body,.bodywrap.nav-collapsed .nav-foot{display:none}
.nav-collapse-in{flex:none;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;
  border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;color:var(--ink2)}
.nav-collapse-in:hover{background:var(--blue-soft);border-color:var(--blue-line);color:var(--blue-dark)}
.nav-brand{padding:16px 16px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line2)}
.nav-brand .nb-mark{height:28px;display:flex;align-items:center;justify-content:center;flex:none}
.nav-brand .nb-mark img{height:28px;width:auto}
.nav-brand h2{font-size:13px;font-weight:600;line-height:1.25}
.nav-brand .sub{font-size:11px;color:var(--faint)}
.nav-body{flex:1;overflow-y:auto;padding:12px 10px}
.nav-sec{font-size:10.5px;font-weight:600;letter-spacing:.06em;color:var(--faint);padding:12px 8px 5px}
.nav-item{width:100%;display:flex;align-items:center;gap:10px;padding:8px 10px;border:none;background:none;
  border-radius:8px;font-size:13.5px;color:var(--ink2);font-weight:500;text-align:left;line-height:1.3;cursor:pointer}
.nav-item svg{flex:none;color:var(--faint)}
.nav-item:hover{background:var(--line2);color:var(--ink)}
.nav-item.active{background:var(--blue-soft);color:var(--blue-dark);font-weight:600}
.nav-item.active svg{color:var(--blue)}
.nav-foot{border-top:1px solid var(--line2);padding:10px 14px;display:flex;flex-direction:column;gap:4px}
.nav-tog{display:none}

/* ---------- page + top filter bar ---------- */
.page{min-width:0;display:flex;flex-direction:column;background:var(--canvas)}
.page-head{background:#fff;padding:14px 22px 10px;display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.page-head h1{font-size:19px;font-weight:600}
.page-head .psub{font-size:12.5px;color:var(--muted);margin-top:2px}
.filterbar{background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 22px;flex-wrap:wrap}
.fgroup{display:flex;align-items:center;gap:2px;flex-wrap:wrap;flex:1;min-width:0}
.f{position:relative}
.fbtn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 9px;border:1px solid transparent;
  border-radius:8px;background:none;font-family:inherit;font-size:13px;color:var(--muted);white-space:nowrap;max-width:230px;cursor:pointer}
.fbtn:hover{background:var(--line2);color:var(--ink2)}
.fbtn.set{background:var(--blue-soft);border-color:var(--blue-line);color:var(--blue-dark)}
.fbtn.open{background:var(--line2);border-color:var(--line)}
.fbtn.set.open{background:var(--blue-soft);border-color:var(--blue)}
.fbtn>svg:first-child{color:var(--faint);flex:none}
.fbtn.set>svg:first-child{color:var(--blue)}
.fbtn .lbl{font-weight:500}
.fbtn .fval{font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fbtn.set .fval{color:var(--blue-dark)}
.fbtn .chev{flex:none;opacity:.55;transition:transform .15s}
.fbtn.open .chev{transform:rotate(180deg)}
.fpop{position:absolute;top:calc(100% + 5px);left:0;z-index:60;min-width:230px;max-width:300px;
  background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-lg);padding:5px;display:none}
.fpop.open{display:block}
.fpop.right{left:auto;right:0}
.fsrch{width:100%;height:30px;border:1px solid var(--line);border-radius:7px;padding:0 8px;font-size:12.5px;
  font-family:inherit;margin-bottom:4px;color:var(--ink)}
.fsrch:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.fopts{max-height:264px;overflow-y:auto;display:flex;flex-direction:column;gap:1px}
.fopt{display:flex;align-items:center;gap:8px;width:100%;padding:7px 8px;border:none;background:none;
  border-radius:6px;font-family:inherit;font-size:13px;color:var(--ink2);text-align:left;line-height:1.3}
.fopt:hover{background:var(--line2)}
.fopt.on{background:var(--blue-soft);color:var(--blue-dark);font-weight:600}
.fopt .ck{width:13px;flex:none;color:var(--blue);opacity:0}
.fopt.on .ck{opacity:1}
.fopt .ot{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fopt .on2{font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums;flex:none}
.fopt.on .on2{color:var(--blue)}
.fnone{padding:12px 8px;text-align:center;color:var(--faint);font-size:12.5px}
.fsearch{border:1px solid var(--line);border-radius:8px;height:32px;padding:0 10px;font-size:13px;font-family:inherit;
  color:var(--ink);width:200px;background:#fff}
.fsearch:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.clear{background:none;border:none;color:var(--blue);font-size:13px;font-weight:600;padding:0 8px;height:32px;border-radius:8px;white-space:nowrap;cursor:pointer}
.clear:hover{background:var(--blue-soft)}
.btn-refresh{height:32px;width:32px;flex:none;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:#fff;border-radius:8px;color:var(--ink2);cursor:pointer}
.btn-refresh:hover{background:var(--line2);color:var(--blue)}
.fb-right{display:flex;align-items:center;gap:10px;flex:none}
.seg{display:inline-flex;background:var(--line2);border-radius:9px;padding:3px;gap:2px}
.sg{flex:none;padding:0 13px;height:26px;border:none;background:none;font-size:12.5px;font-weight:500;color:var(--muted);border-radius:7px;cursor:pointer}
.sg:hover{color:var(--ink)}
.sg.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:var(--shadow-sm)}
.dates{display:none;align-items:center;gap:5px}
.dates.show{display:inline-flex}
.dates input{width:auto;height:30px;border:1px solid var(--line);border-radius:7px;padding:0 7px;font-size:12.5px;font-family:inherit;color:var(--ink);background:#fff}
.dates input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.dates span{font-size:11px;color:var(--faint)}
.rangelbl{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap}
.fcount{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.canvas{padding:18px 22px 40px;max-width:1440px}

/* ---------- surfaces ---------- */
.grid{display:grid;gap:12px}
/* 1fr resolves to minmax(auto,1fr): a nowrap table would push its column past
   the container. min-width:0 lets the column shrink and .tbl-wrap scroll. */
.grid>*{min-width:0}
.k4{grid-template-columns:repeat(4,1fr)}
.k6{grid-template-columns:repeat(6,1fr)}
.k5{grid-template-columns:repeat(5,1fr)}
@media(max-width:1500px){.k5{grid-template-columns:repeat(3,1fr)}}
@media(max-width:820px){.k5{grid-template-columns:repeat(2,1fr)}}
.kpi-val.long{font-size:21px;letter-spacing:-.02em}
.three{grid-template-columns:repeat(3,1fr)}
@media(max-width:1100px){.three{grid-template-columns:1fr}}
@media(max-width:1500px){.k6{grid-template-columns:repeat(3,1fr)}}
@media(max-width:820px){.k6{grid-template-columns:repeat(2,1fr)}}
.k3{grid-template-columns:repeat(3,1fr)}
.two{grid-template-columns:1fr 1fr}
@media(max-width:1240px){.k4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:960px){.two,.k3{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm)}
.kpi{padding:15px 16px}
.kpi .accent{display:none}
.kpi .cap{font-size:12.5px;color:var(--muted);font-weight:500}
.kpi .kpi-val{font-size:27px;font-weight:700;letter-spacing:-.025em;margin-top:6px;line-height:1.1}
/* PM-tool single-row stat strip */
.stat-strip{display:flex;align-items:stretch;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 4px;overflow-x:auto;box-shadow:var(--shadow-sm)}
.stat-strip::-webkit-scrollbar{height:0}
.stat{flex:1 1 0;min-width:132px;padding:2px 18px;display:flex;flex-direction:column;gap:2px;border-left:1px solid var(--line2);justify-content:flex-start}
.stat:first-child{border-left:none}
.stat-v{font-size:25px;font-weight:700;letter-spacing:-.02em;line-height:1.1;color:var(--ink);font-variant-numeric:tabular-nums}
.stat-v.sm{font-size:19px}
.stat-l{font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.stat-s{font-size:11px;color:var(--faint);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .sub{font-size:12px;color:var(--faint);margin-top:5px}
.panel{padding:16px 18px}
.panel h3{font-size:14.5px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.panel .desc{font-size:12.5px;color:var(--muted);margin:3px 0 14px;line-height:1.45}
.insight{border-left:3px solid var(--line);padding:3px 0 3px 12px;font-size:12.5px;color:var(--muted);margin-top:12px;line-height:1.55}
.insight b{color:var(--ink2);font-weight:600}
.insight.bad{border-left-color:var(--red)}
.insight.good{border-left-color:var(--green)}
.chip{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;
  background:var(--line2);color:var(--ink2);letter-spacing:.01em}
.c-good{background:var(--green-soft);color:var(--green)}
.c-warn{background:var(--amber-soft);color:var(--amber)}
.c-bad{background:var(--red-soft);color:var(--red)}
.c-brand{background:var(--blue-soft);color:var(--blue-dark)}
.c-mut{background:var(--line2);color:var(--muted)}
.c-gold{background:var(--blue-soft);color:var(--blue-dark)}
.crumb{font-size:11px;padding:2px 7px;border-radius:6px;background:var(--line2);color:var(--muted);margin-right:3px;display:inline-block}
.chart svg{display:block;width:100%;overflow:visible}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:3px}
.hint{font-size:11.5px;color:var(--faint);margin-top:8px}

/* ---------- tables ---------- */
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
thead th{position:sticky;top:0;background:var(--soft);text-align:left;font-size:11px;color:var(--muted);
  font-weight:600;letter-spacing:.03em;padding:9px 11px;border-bottom:1px solid var(--line);white-space:nowrap;
  cursor:pointer;user-select:none;z-index:2;text-transform:uppercase}
thead th:hover{color:var(--ink2)}
tbody td{padding:9px 11px;border-bottom:1px solid var(--line2);white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--soft)}
tbody tr.clickable{cursor:pointer}
td.n,th.n{text-align:right}
th .ar{color:var(--blue);margin-left:3px;font-size:8px}
.avatar{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  font-size:9.5px;font-weight:600;color:#fff;flex:none}
.owner-cell{display:flex;align-items:center;gap:8px}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.tbl-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;flex-wrap:wrap}
.btn-exp{height:30px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:0 11px;
  font-size:12.5px;font-weight:500;color:var(--ink2);box-shadow:var(--shadow-sm)}
.btn-exp:hover{border-color:var(--blue);color:var(--blue)}
.pager{display:flex;align-items:center;gap:8px;justify-content:flex-end;padding:11px 2px 0;font-size:12.5px;color:var(--muted)}
.pager button{height:28px;padding:0 10px;border:1px solid var(--line);background:#fff;border-radius:7px;font-weight:500;color:var(--ink2);font-size:12px}
.pager button:disabled{opacity:.4;cursor:default}
.bar-mini{height:6px;background:var(--line2);border-radius:3px;overflow:hidden;min-width:50px;display:inline-block;vertical-align:middle}
.bar-mini>span{display:block;height:100%;border-radius:3px}
.mini-chips{display:flex;gap:5px;flex-wrap:wrap}
.mc{font-size:12px;font-weight:500;padding:5px 10px;border-radius:7px;border:1px solid var(--line);background:#fff;color:var(--muted)}
.mc.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.mc .n{opacity:.65;margin-left:3px}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(17,24,39,.4);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(820px,95vw);background:var(--canvas);z-index:61;
  transform:translateX(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);overflow-y:auto;box-shadow:var(--shadow-lg)}
.drawer.open{transform:translateX(0)}
.dh{background:#fff;border-bottom:1px solid var(--line);padding:16px 20px;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px}
.dh .avatar{width:38px;height:38px;font-size:14px}
.dh h2{font-size:16px;font-weight:600}
.dh .r{font-size:12.5px;color:var(--muted);margin-top:1px}
.dh .close{margin-left:auto;background:#fff;border:1px solid var(--line);width:30px;height:30px;border-radius:8px;font-size:16px;color:var(--muted);line-height:1}
.dh .close:hover{border-color:var(--red);color:var(--red)}
.dbody{padding:16px 20px 46px}
.mini-kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.mini-kpi .c{font-size:11.5px;color:var(--muted);font-weight:500}
.mini-kpi .v{font-size:19px;font-weight:700;margin-top:3px;letter-spacing:-.02em}
.rev-seg{display:inline-flex;background:var(--line2);border-radius:8px;padding:3px;gap:2px}
.rev-seg .sg{flex:none;padding:0 13px;height:26px;border:none;background:none;font-size:12px;font-weight:500;color:var(--muted);border-radius:6px;cursor:pointer}
.rev-seg .sg:hover{color:var(--ink)}
.rev-seg .sg.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:var(--shadow-sm)}
.team-seg{display:inline-flex;background:var(--line2);border-radius:8px;padding:3px;gap:2px}
.team-seg .sg{flex:none;padding:0 15px;height:28px;border:none;background:none;font-size:12.5px;font-weight:500;color:var(--muted);border-radius:6px;cursor:pointer}
.team-seg .sg:hover{color:var(--ink)}
.team-seg .sg.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:var(--shadow-sm)}
.sect-t{font-size:11px;letter-spacing:.05em;color:var(--faint);font-weight:600;margin:18px 0 9px;text-transform:uppercase}
/* All Accounts table + Excel-style filters */
.acct-meta{font-size:12px;color:var(--muted);margin-bottom:8px}
.acct-reset{background:none;border:none;color:var(--blue);font-weight:600;font-size:12px;cursor:pointer;padding:0}
.acct-reset:hover{text-decoration:underline}
.acct-wrap{overflow:auto}
.acct-table{min-width:1060px;font-size:12.5px}
.acct-table th{position:sticky;top:0;background:var(--soft);z-index:1;white-space:nowrap}
.acct-th{padding:0!important}
.acct-th>*{display:inline-flex;vertical-align:middle}
.acct-sort{padding:9px 6px 9px 10px;cursor:pointer;font-weight:600;color:var(--ink2);user-select:none}
.acct-sort:hover{color:var(--blue)}
.acct-fbtn{border:none;background:none;color:var(--faint);font-size:10px;padding:6px 8px 6px 2px;cursor:pointer;border-radius:6px}
.acct-fbtn:hover{background:var(--line2);color:var(--ink2)}
.acct-fbtn.on{color:var(--blue);background:var(--blue-soft)}
.acct-table td{padding:8px 10px;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.acct-pop{position:fixed;z-index:120;width:248px;background:#fff;border:1px solid var(--line);border-radius:10px;
  box-shadow:var(--shadow-lg);padding:8px}
.acct-pop-act{display:flex;gap:6px;margin:6px 0}
.acct-pop-act button{flex:1;border:1px solid var(--line);background:var(--soft);border-radius:6px;padding:5px 0;font-size:11.5px;font-weight:600;color:var(--ink2);cursor:pointer}
.acct-pop-act button:hover{background:var(--line2)}
.acct-opts{max-height:230px;overflow-y:auto;display:flex;flex-direction:column;gap:1px}
.acct-opt{display:flex;align-items:center;gap:8px;padding:6px 6px;border-radius:6px;font-size:12.5px;color:var(--ink2);cursor:pointer}
.acct-opt:hover{background:var(--line2)}
.acct-opt input{accent-color:var(--blue);flex:none}
.acct-opt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:24px;text-align:center;color:var(--faint);font-size:12.5px}
.rosrow{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 8px;border-radius:7px;cursor:pointer}
.rosrow:hover{background:var(--line2)}

@media(max-width:900px){
  .nav{position:fixed;left:0;top:58px;z-index:50;height:calc(100vh - 58px);
    transform:translateX(-100%);transition:transform .24s;box-shadow:var(--shadow-lg)}
  .nav.open{transform:translateX(0)}
  .nav-tog{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;
    border:1px solid var(--line);background:#fff;border-radius:8px;color:var(--ink2);font-size:15px}
  .nav-collapse-btn{display:none}
  .bodywrap,.bodywrap.nav-collapsed{grid-template-columns:1fr}
  .canvas,.page-head,.filterbar{padding-left:14px;padding-right:14px}
  .topmeta{display:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
let RAW=null, CU=[], META={}, AM=[], TEAM=[];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct=(a,b)=>b?100*a/b:0;
const fpct=(a,b)=>b?(100*a/b).toFixed(1)+'%':'—';
function inr(v){if(v==null)return'—';const a=Math.abs(v);
  if(a>=1e7)return'₹'+(v/1e7).toFixed(2)+' Cr';
  if(a>=1e5)return'₹'+(v/1e5).toFixed(2)+' L';
  if(a>=1e3)return'₹'+(v/1e3).toFixed(1)+'K';return'₹'+Math.round(v);}
function inrFull(v){return'₹'+Math.round(v).toLocaleString('en-IN');}
function fdays(d){if(d==null||d<0)return'—';if(d<60)return d+'d';if(d<365)return(d/30.4).toFixed(1)+'mo';return(d/365).toFixed(1)+'y';}
function initials(n){const p=String(n).trim().split(/\s+/);return((p[0]||'?')[0]+(p[1]||'')[0]||'').toUpperCase();}
function color4name(n){let h=0;for(const c of String(n))h=(h*31+c.charCodeAt(0))%360;return `hsl(${215+(h%40)-20} 18% 52%)`;}
const isAM=o=>AM.includes(o);
let COURSES=[], OWNERS=[], COUNTRIES=[];

/* ---------- state ---------- */
let TAB='overview';
const F={owner:'all',book:'all',team:'am',range:'all',from:'',to:'',ptype:'all',age:'all',course:'all',region:'all',country:'all',src:'all',tier:'all',dorm:'all',cert:'all',search:''};
let cSort={k:'r',dir:-1}, cPage=1; const PAGE=50;
let oSort={k:'r',dir:-1};
let fCU=[];
/* ---------------- deal fact table ----------------
   Columnar arrays; dU indexes CU directly. Lets every view recompute from
   filtered deals instead of frozen rollups. */
let FT=null, MONTHS=[], ODIM=[], CDIM=[], NDEAL=0;
let fDeal=[];              // indices of deals passing the current filters
let custPass=new Uint8Array(0);
let custPassND=new Uint8Array(0);   // passes all non-date filters, ignores the close-date range
let CIDX=new Map();

/* Slicers. scope 'report' = always on. Others apply ONLY on the tabs listed,
   so a hidden slicer never filters invisibly. */
const SLICERS=[
  {k:'book',label:'Team',tabs:['overview','amteam','cohorts','reps','customers','upsell'],fixed:[['all','All owners'],['am','AM team'],['nonam','Others']],
   count:v=>tally('book',c=>c.am?'am':'nonam').get(v)||0},
  {k:'owner',label:'Account owner',scope:'report',dyn:()=>tally('owner',c=>c.o)},
  {k:'ptype',label:'Type',tabs:['overview','amteam'],
   fixed:[['all','All deals'],['new','First purchase'],['rep','Repeat purchase']]},
  {k:'course',label:'Course',tabs:['overview','amteam','cohorts','reps','customers','upsell'],dyn:()=>tally('course',c=>c.cs.split('|'))},
  {k:'region',label:'Region',tabs:['overview','amteam','cohorts','reps','customers','upsell'],
   fixed:()=>[['all','All']].concat((META.regions||[]).map(r=>[r,r])),
   count:v=>tally('region',c=>c.rg).get(v)||0},
  {k:'country',label:'Country',tabs:['overview','amteam','cohorts','reps','customers','upsell'],dyn:()=>tally('country',c=>c.c),cap:60},
  {k:'src',label:'Source',tabs:['overview','amteam','cohorts','customers'],dyn:()=>tally('src',c=>c.src)},
  {k:'tier',label:'Purchases',tabs:['overview','amteam','cohorts','customers','upsell'],
   fixed:[['all','All'],['repeat','Repeat buyers'],['once','One-time only'],['whale','₹1L+ lifetime']],
   count:v=>{const m=tally('tier',c=>c.d>1?'repeat':'once');
     if(v==='repeat'||v==='once')return m.get(v)||0;
     if(v==='whale')return CU.filter(c=>passExcept(c,'tier')&&c.r>=100000).length;return 0;}},
  {k:'dorm',label:'Last buy',tabs:['amteam','customers','upsell'],
   fixed:[['all','Any time'],['active','Within 90 days'],['warm','90 days – 1 year'],['cold','1 – 2 years'],['frozen','Over 2 years']],
   count:v=>tally('dorm',c=>c.dm<90?'active':c.dm<365?'warm':c.dm<730?'cold':'frozen').get(v)||0},
  {k:'cert',label:'Certified',tabs:['overview','amteam','cohorts','customers'],
   fixed:[['all','All'],['yes','Certified'],['no','Not certified']],
   count:v=>tally('cert',c=>c.ct?'yes':'no').get(v)||0},
  {k:'search',label:'Search',tabs:['amteam','reps','customers','upsell'],input:true},
];
const onTab=(s,tab)=>s.scope==='report'||(s.tabs||[]).includes(tab||TAB);
const activeSlicers=()=>SLICERS.filter(s=>onTab(s,TAB));
/* A page-level filter is inert unless its slicer is on this tab. */
function live(k){const s=SLICERS.find(x=>x.k===k);return s?onTab(s,TAB):false;}

/* ---- top time control ----
   Deals carry dG = days since close, so the range is expressed as an age
   window [minAge, maxAge]. Day precision without storing dates. */
let TDAY=null;
const DAY=864e5;
function isoAgo(g){return new Date(TDAY.getTime()-g*DAY).toISOString().slice(0,10);}
function rangeG(){
  if(F.range==='all')return null;
  if(F.range==='today')return[0,0];                                          // the as-of date itself
  if(F.range==='week'){const back=(TDAY.getDay()+6)%7;return[0,back];}      // Mon -> today
  if(F.range==='month')return[0,TDAY.getDate()-1];                          // 1st -> today
  if(F.range==='custom'){
    if(!F.from||!F.to)return null;
    const g1=Math.round((TDAY-Date.parse(F.to+'T00:00:00'))/DAY);
    const g2=Math.round((TDAY-Date.parse(F.from+'T00:00:00'))/DAY);
    return g1<=g2?[g1,g2]:[g2,g1];
  }
  return null;
}
function rangeLabel(){
  const g=rangeG();
  if(!g)return'All time';
  if(g[0]===0&&g[1]===0)return isoAgo(0);
  return `${isoAgo(g[1])} to ${isoAgo(g[0])}`;
}
/* customers with at least one deal inside the window */
let custInRange=new Uint8Array(0), rangeOn=false;
function computeRange(){
  const g=rangeG();
  rangeOn=!!g;
  if(!g)return;
  custInRange.fill(0);
  for(let i=0;i<NDEAL;i++){const a=FT.dG[i];if(a>=g[0]&&a<=g[1])custInRange[FT.dU[i]]=1;}
}
/* month window still needed for the monthly charts */
function periodRange(){
  const g=rangeG();
  if(!g)return[0,MONTHS.length-1];
  const lo=isoAgo(g[1]).slice(0,7), hi=isoAgo(g[0]).slice(0,7);
  let a=MONTHS.indexOf(lo), b=MONTHS.indexOf(hi);
  if(a<0)a=0; if(b<0)b=MONTHS.length-1;
  return[a,b];
}
/* Customer-grain predicate, skipping one key (for slicer option counts). */
function passExcept(c,skip){
  if(c.int)return false;   // eduhubspot.com internal accounts are excluded from the whole board
  if(skip!=='range'&&rangeOn&&!custInRange[CIDX.get(c)])return false;
  if(skip!=='book'){if(F.book==='am'&&!c.am)return false;if(F.book==='nonam'&&c.am)return false;}
  if(skip!=='owner'&&F.owner!=='all'&&c.o!==F.owner)return false;
  if(skip!=='course'&&live('course')&&F.course!=='all'&&!c.cs.split('|').includes(F.course))return false;
  if(skip!=='region'&&live('region')&&F.region!=='all'&&c.rg!==F.region)return false;
  if(skip!=='country'&&live('country')&&F.country!=='all'&&c.c!==F.country)return false;
  if(skip!=='src'&&live('src')&&F.src!=='all'&&c.src!==F.src)return false;
  if(skip!=='tier'&&live('tier')){
    if(F.tier==='repeat'&&c.d<2)return false;
    if(F.tier==='once'&&c.d!==1)return false;
    if(F.tier==='whale'&&c.r<100000)return false;}
  if(skip!=='dorm'&&live('dorm')){
    if(F.dorm==='active'&&c.dm>=90)return false;
    if(F.dorm==='warm'&&!(c.dm>=90&&c.dm<365))return false;
    if(F.dorm==='cold'&&!(c.dm>=365&&c.dm<730))return false;
    if(F.dorm==='frozen'&&c.dm<730)return false;}
  if(skip!=='cert'&&live('cert')){
    if(F.cert==='yes'&&!c.ct)return false;
    if(F.cert==='no'&&c.ct)return false;}
  if(F.search&&live('search')){const q=F.search.toLowerCase();
    if(!(c.n.toLowerCase().includes(q)||c.e.includes(q)||String(c.p).includes(q)))return false;}
  return true;
}
function pass(c){return passExcept(c,null);}
function recompute(){
  computeRange();                       // must run before pass() / tally()
  fCU=[];custPass.fill(0);custPassND.fill(0);
  CU.forEach((c,i)=>{if(!pass(c))return;fCU.push(c);custPass[i]=1;});
  CU.forEach((c,i)=>{if(passExcept(c,'range'))custPassND[i]=1;});
  const g=rangeG();
  const useType=live('ptype'), useAge=live('age');
  fDeal=[];
  for(let i=0;i<NDEAL;i++){
    if(!custPass[FT.dU[i]])continue;
    if(g&&(FT.dG[i]<g[0]||FT.dG[i]>g[1]))continue;
    if(useType){if(F.ptype==='new'&&FT.dR[i])continue;if(F.ptype==='rep'&&!FT.dR[i])continue;}
    if(useAge){if(F.age==='pre'&&FT.dG[i]>=90)continue;if(F.age==='post'&&FT.dG[i]<90)continue;}
    fDeal.push(i);
  }
}
/* monthly series from the filtered fact table */
function monthly(){
  const [lo,hi]=periodRange();
  const m={};
  for(let x=lo;x<=hi;x++)m[x]={m:MONTHS[x],amD:0,amR:0,amRep:0,amRepR:0,amNew:0,otD:0,otR:0,otRep:0,otNew:0,amTS:0,otTS:0};
  for(const i of fDeal){
    const b=m[FT.dM[i]];if(!b)continue;
    const isam=AM.includes(ODIM[FT.dO[i]]);
    const p=isam?'am':'ot';
    b[p+'D']++;b[p+'R']+=FT.dA[i];
    if(FT.dR[i]){b[p+'Rep']++;if(isam)b.amRepR+=FT.dA[i];}else b[p+'New']++;
  }
  const arr=Object.values(m);
  arr.forEach(b=>{b.amTS=b.amD?Math.round(b.amR/b.amD):0;b.otTS=b.otD?Math.round(b.otR/b.otD):0;});
  return arr;
}
function dealAgg(){
  let d=0,r=0,rep=0,repR=0,amD=0,amR=0,otD=0,otR=0;
  for(const i of fDeal){
    const isam=AM.includes(ODIM[FT.dO[i]]);
    d++;r+=FT.dA[i];
    if(FT.dR[i]){rep++;repR+=FT.dA[i];}
    if(isam){amD++;amR+=FT.dA[i];}else{otD++;otR+=FT.dA[i];}
  }
  return{d,r,rep,repR,amD,amR,otD,otR,ts:d?Math.round(r/d):0,
    amTS:amD?Math.round(amR/amD):0,otTS:otD?Math.round(otR/otD):0};
}

/* ---------- charts ---------- */
function bars(data,o){
  const {w=560,h=190,keys,colors,labels,fmt=(v=>v)}=o;
  const pad={l:42,r:8,t:14,b:28},iw=w-pad.l-pad.r,ih=h-pad.t-pad.b;
  const max=Math.max(1,...data.flatMap(d=>keys.map(k=>d[k])));
  const n=data.length,gw=iw/n,bw=Math.min(30,(gw-5)/keys.length);
  let s=`<svg viewBox="0 0 ${w} ${h}">`;
  for(let g=0;g<=4;g++){const y=pad.t+ih-ih*g/4;
    s+=`<line x1="${pad.l}" y1="${y}" x2="${w-pad.r}" y2="${y}" stroke="var(--line2)"/>`;
    s+=`<text x="${pad.l-6}" y="${y+3}" text-anchor="end" font-size="9" fill="var(--faint)">${fmt(max*g/4)}</text>`;}
  data.forEach((d,i)=>{const x0=pad.l+gw*i+(gw-bw*keys.length)/2;
    keys.forEach((k,j)=>{const bh=ih*d[k]/max,x=x0+bw*j,y=pad.t+ih-bh;
      s+=`<rect x="${x}" y="${y}" width="${bw-2}" height="${Math.max(0,bh)}" rx="2.5" fill="${colors[j]}"><title>${labels[i]} · ${k}: ${fmt(d[k])}</title></rect>`;});
    if(n<=16||i%2===0)s+=`<text x="${pad.l+gw*i+gw/2}" y="${h-8}" text-anchor="middle" font-size="9" fill="var(--muted)">${labels[i]}</text>`;});
  return s+`</svg>`;
}
function lineChart(data,o){
  const {w=560,h=200,xk,yk,label}=o;
  const pad={l:42,r:10,t:14,b:28},iw=w-pad.l-pad.r,ih=h-pad.t-pad.b;
  const max=Math.max(...data.map(d=>d[yk]));
  const X=i=>pad.l+iw*i/(data.length-1||1), Y=v=>pad.t+ih-ih*v/max;
  let p=data.map((d,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(d[yk]).toFixed(1)}`).join(' ');
  let s=`<svg viewBox="0 0 ${w} ${h}">`;
  for(let g=0;g<=4;g++){const y=pad.t+ih-ih*g/4;
    s+=`<line x1="${pad.l}" y1="${y}" x2="${w-pad.r}" y2="${y}" stroke="var(--line2)"/>
    <text x="${pad.l-6}" y="${y+3}" text-anchor="end" font-size="9" fill="var(--faint)">${inr(max*g/4)}</text>`;}
  s+=`<path d="${p} L${X(data.length-1)},${pad.t+ih} L${X(0)},${pad.t+ih} Z" fill="var(--accent-soft)" opacity=".85"/>`;
  s+=`<path d="${p}" fill="none" stroke="var(--d1)" stroke-width="1.75" stroke-linejoin="round"/>`;
  data.forEach((d,i)=>{s+=`<circle cx="${X(i)}" cy="${Y(d[yk])}" r="2" fill="var(--d1)"><title>${d[xk]}: ${inr(d[yk])}</title></circle>`;
    if(i%3===0)s+=`<text x="${X(i)}" y="${h-8}" text-anchor="middle" font-size="8.5" fill="var(--muted)">${d[xk].slice(2)}</text>`;});
  return s+`</svg>`;
}
function donut(segs,o={}){
  const size=o.size||150,thick=o.thick||26,r=(size-thick)/2,cx=size/2,cy=size/2,cir=2*Math.PI*r;
  const tot=segs.reduce((a,s)=>a+s.v,0)||1;let off=0;
  let s=`<svg viewBox="0 0 ${size} ${size}"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--line2)" stroke-width="${thick}"/>`;
  segs.forEach(g=>{const len=cir*g.v/tot;
    s+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${g.c}" stroke-width="${thick}" stroke-dasharray="${len} ${cir-len}" stroke-dashoffset="${-off}" transform="rotate(-90 ${cx} ${cy})"><title>${g.label}: ${g.v}</title></circle>`;off+=len;});
  s+=`<text x="${cx}" y="${cy-1}" text-anchor="middle" font-size="19" font-weight="700" font-family="Space Grotesk" fill="var(--ink)">${o.centerVal||tot}</text>
  <text x="${cx}" y="${cy+14}" text-anchor="middle" font-size="9.5" fill="var(--muted)">${o.center||''}</text></svg>`;
  return s;
}
function hbars(rows,o={}){
  const max=Math.max(1,...rows.map(r=>r.v));let s=`<div style="display:flex;flex-direction:column;gap:9px">`;
  rows.forEach(r=>{s+=`<div style="display:flex;align-items:center;gap:10px">
    <div style="width:${o.lw||130}px;font-size:12px;color:var(--ink2);text-align:right;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.label)}</div>
    <div class="bar-mini" style="flex:1;height:16px"><span style="width:${pct(r.v,max)}%;background:${r.c||'var(--brand)'}"></span></div>
    <div style="width:${o.vw||64}px;font-size:12px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums">${r.disp!=null?r.disp:r.v}</div></div>`;});
  return s+`</div>`;
}
const sortIco=(cur,k)=>cur.k===k?`<span class="ar">${cur.dir>0?'▲':'▼'}</span>`:'';

/* ---------- KPIs ---------- */
function kpis(){
  const n=fCU.length, rev=fCU.reduce((a,c)=>a+c.r,0);
  const rep=fCU.filter(c=>c.d>1), repRev=rep.reduce((a,c)=>a+c.r,0);
  const amc=fCU.filter(c=>c.am);
  const dormant=fCU.filter(c=>c.dm>=365);
  const certd=fCU.filter(c=>c.ct);
  return {n,rev,rep:rep.length,repRev,amc:amc.length,dormant:dormant.length,
    dormRev:dormant.reduce((a,c)=>a+c.r,0),cert:certd.length,
    arpu:n?rev/n:0,deals:fCU.reduce((a,c)=>a+c.d,0)};
}

/* ---------- overview aggregations ---------- */
/* Of customers who bought again, was the repeat the SAME course or a new one?
   Same-course repeat is a re-purchase; a different course is cross-sell. */
function repeatPattern(){
  const byC=new Map();
  for(const i of fDeal){
    if(!byC.has(FT.dU[i]))byC.set(FT.dU[i],[]);
    byC.get(FT.dU[i]).push(i);
  }
  let tot=0,same=0,diff=0,both=0;
  const byFirst={};
  byC.forEach(idx=>{
    if(idx.length<2)return;
    idx.sort((a,b)=>FT.dG[b]-FT.dG[a]);          // oldest first
    const f=FT.dC[idx[0]];
    let hs=false,hd=false;
    for(let j=1;j<idx.length;j++){if(FT.dC[idx[j]]===f)hs=true;else hd=true;}
    tot++;
    const fc=CDIM[f];
    const b=byFirst[fc]=byFirst[fc]||{c:fc,n:0,same:0,diff:0,both:0};
    b.n++;
    if(hs&&hd){both++;b.both++;}else if(hs){same++;b.same++;}else{diff++;b.diff++;}
  });
  return{tot,same,diff,both,byFirst:Object.values(byFirst).sort((a,b)=>b.n-a.n)};
}
function regionAgg(){
  const m={};
  for(const i of fDeal){
    const cc=CU[FT.dU[i]];
    const rg=cc.rg||SPEC.regionOther;
    const x=m[rg]=m[rg]||{c:rg,d:0,r:0,rep:0,_cu:new Set(),_co:new Set()};
    x.d++;x.r+=FT.dA[i];x._cu.add(FT.dU[i]);x._co.add(cc.c);
    if(FT.dR[i])x.rep++;
  }
  return Object.values(m).map(x=>({c:x.c,d:x.d,r:x.r,rep:x.rep,cu:x._cu.size,co:x._co.size,
    ts:x.d?Math.round(x.r/x.d):0,repPct:x.d?100*x.rep/x.d:0,
    arpu:x._cu.size?Math.round(x.r/x._cu.size):0}));
}
const HEALTH=[
  {k:'active',l:'Active',sub:'purchased within 90 days',lo:0,hi:90,c:'var(--d1)'},
  {k:'warm',l:'Warm',sub:'90 days – 1 year',lo:90,hi:365,c:'var(--d2)'},
  {k:'cold',l:'Cold',sub:'1 – 2 years',lo:365,hi:730,c:'var(--d3)'},
  {k:'frozen',l:'Frozen',sub:'over 2 years',lo:730,hi:1e9,c:'var(--neg)'},
];
function healthAgg(){
  // deals counted from the filtered fact table, so the column agrees with
  // the Total deals card rather than each account's lifetime count.
  const dc=new Int32Array(CU.length);
  for(const i of fDeal)dc[FT.dU[i]]++;
  return HEALTH.map(b=>{
    const s=fCU.filter(c=>c.dm>=b.lo&&c.dm<b.hi);
    const r=s.reduce((a,c)=>a+c.r,0);
    let deals=0;
    s.forEach(c=>{deals+=dc[CIDX.get(c)];});
    return{...b,n:s.length,r,ltv:s.length?Math.round(r/s.length):0,
      rep:s.filter(c=>c.d>1).length,
      deals,
      dpa:s.length?deals/s.length:0,
      cert:s.filter(c=>c.ct).length,
      revoked:s.filter(c=>revoked(c)).length, // access-revoked (dated) — board-wide logic
      grants:s.length};});
}
let ovnSort={k:'r',dir:-1};
function sortOvn(k){if(ovnSort.k===k)ovnSort.dir*=-1;else ovnSort={k,dir:k==='c'?1:-1};paint();}
function sortRows(rows,s){return rows.slice().sort((a,b)=>{const x=a[s.k],y=b[s.k];
  if(typeof x==='string')return s.dir*x.localeCompare(y);return s.dir*((x||0)-(y||0));});}

/* ---------- views ---------- */
/* PM-tool style single-row stat strip: one outlined container, big number on top,
   uppercase label under, thin dividers between. arr = [[label, value, sub?], ...] */
function statStrip(arr){
  return `<div class="stat-strip">`+arr.map(c=>{
    const long=String(c[1]).replace(/[^0-9A-Za-z]/g,'').length>8;
    return `<div class="stat"><div class="stat-v${long?' sm':''}">${c[1]}</div>`+
      `<div class="stat-l">${c[0]}</div>${c[2]?`<div class="stat-s">${c[2]}</div>`:''}</div>`;
  }).join('')+`</div>`;
}

function freshTriggers(){

  fCU.forEach(c=>{
    const i=CIDX.get(c), s=new Set();
    if(c.ag>=90)s.add(new Date(TDAY.getTime()-(c.ag-90)*DAY).toISOString().slice(0,7));
    if(c.ct&&c.ctd>=0)s.add(new Date(TDAY.getTime()-c.ctd*DAY).toISOString().slice(0,7));
    if(c.ar&&c.ard>=0)s.add(new Date(TDAY.getTime()-c.ard*DAY).toISOString().slice(0,7));
    if(s.size)t.set(i,s);

  // Everything below is counted to the DAY — never rounded out to whole months —
  // so the window always matches the picker, and recomputes live on every filter.
  const gR=rangeG();
  const inRange=age=>age>=0&&(!gR||(age>=gR[0]&&age<=gR[1]));

  // --- LEADS are distinct ACCOUNTS credited to the current account owner ---
  // Cert / Revoke are account attributes: one dated event per lead. Count the
  // lead once if that event's date falls inside the exact window.
  CU.forEach((c,i)=>{

    if(revoked(c))x._lRev.add(i);

  // The rule only began in Oct 2025, so only deals that closed from Oct 2025
  // onward are subject to it — earlier closings never went through the round robin.
  // Count the distinct LEAD once if ANY of its qualifying deals crosses 90 days
  // inside the window. Independent of the deal-close date filter.
  const ruleMaxAge=Math.round((TDAY.getTime()-Date.parse(SPEC.ruleStart+'T00:00:00'))/DAY);
  for(let i=0;i<NDEAL;i++){
    if(!custPassND[FT.dU[i]])continue;
    if(FT.dG[i]>ruleMaxAge)continue;                 // deal closed before the 90-day rule began

  }

/* Per-agent total & fresh sales for the current filter window: Total = deals the

function teamPerf(){

  const ruleMaxAge=Math.round((TDAY.getTime()-Date.parse(SPEC.ruleStart+'T00:00:00'))/DAY);
  const winFresh=new Map();
  freshTriggerAges(()=>true).forEach((age,i)=>winFresh.set(i,CU[i].o));      // accounts fresh IN the window (cohort)
  const tot={}, fr={}; TEAM.forEach(o=>{tot[o]={d:0,r:0};fr[o]={d:0,r:0};});
  const oTot={d:0,r:0}, oFr={d:0,r:0};
  for(let i=0;i<NDEAL;i++){
    if(!custPassND[FT.dU[i]]||FT.dG[i]>ruleMaxAge||!inRange(FT.dG[i]))continue;   // closed-won in the selected window
    const cl=ODIM[FT.dO[i]]; if(tot[cl]){tot[cl].d++;tot[cl].r+=FT.dA[i];} else {oTot.d++;oTot.r+=FT.dA[i];}   // Overall: credited to Course Deal Owner (closer)
    const wo=winFresh.get(FT.dU[i]); if(wo!==undefined){if(fr[wo]){fr[wo].d++;fr[wo].r+=FT.dA[i];} else {oFr.d++;oFr.r+=FT.dA[i];}}  // Fresh: from this window's cohort, by owner
  }
  return {tot,fr,oTot,oFr};
}
function agentMonthFull(){

/* ---------- access / revocation ----------

   (every deal for a customer carries the same value), so this is account-grain

   be forecast; only actual revocations are knowable. */
function accessAgg(){
  const out={accounts:fCU.length,revoked:0,live:0,dated:0,undated:0,
             byMonth:{},byDay:{},byCourse:{},owners:{}};
  fCU.forEach(c=>{
    const o=c.o;
    out.owners[o]=out.owners[o]||{rev:0,act:0};
    if(!c.ar){out.live++;out.owners[o].act++;return;}
    out.revoked++;out.owners[o].rev++;
    out.byCourse[c.arc||'(not recorded)']=(out.byCourse[c.arc||'(not recorded)']||0)+1;
    if(c.ard<0){out.undated++;return;}
    out.dated++;
    const dt=new Date(TDAY.getTime()-c.ard*DAY);
    const m=dt.toISOString().slice(0,7);
    out.byMonth[m]=(out.byMonth[m]||0)+1;
    if(c.ard<=60)out.byDay[dt.toISOString().slice(0,10)]=(out.byDay[dt.toISOString().slice(0,10)]||0)+1;
  });
  return out;
}
/* ---------- repeat PMP ---------- */
function pmpAgg(){
  const pi=CDIM.indexOf('PMP');
  const m=new Map();
  if(pi<0)return{n:0,repeat:0,dist:{},gaps:[],afterExpiry:0,beforeExpiry:0,owners:{}};
  for(const i of fDeal){
    if(FT.dC[i]!==pi)continue;
    const u=FT.dU[i];
    if(!m.has(u))m.set(u,[]);
    m.get(u).push(FT.dG[i]);
  }
  const A=365;   // the stated access policy, used only to split the gap
  const dist={},owners={};let repeat=0,after=0,before=0;
  const gapsB=[[0,90,'<3mo'],[90,365,'3–12mo'],[365,400,'~1yr'],[400,730,'1–2yr'],[730,1e9,'>2yr']];
  const gaps=gapsB.map(b=>({l:b[2],n:0}));
  m.forEach((ages,u)=>{
    const n=ages.length;
    const key=n>=5?'5+':String(n);
    dist[key]=(dist[key]||0)+1;
    if(n>1){
      repeat++;
      ages.sort((a,b)=>b-a);                    // oldest first
      const span=ages[0]-ages[ages.length-1];
      for(let j=0;j<gapsB.length;j++){if(span>=gapsB[j][0]&&span<gapsB[j][1]){gaps[j].n++;break;}}
      for(let j=1;j<ages.length;j++){const d=ages[j-1]-ages[j];if(d>=A)after++;else before++;}
      const o=CU[u].o;owners[o]=(owners[o]||0)+1;
    }
  });
  return{n:m.size,repeat,dist,gaps,afterExpiry:after,beforeExpiry:before,owners};
}
/* ---------- certifications ---------- */
function certAgg(){

}

function stackBars(data,o){

      s+=`<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(0,bh)}" fill="${colors[j]}" ${i===partial?'opacity=".55"':''}><title>${labels[i]} · ${k}: ${fmt(d[k])}</title></rect>`;acc+=bh;});

}
/* Course mix: what each AM member sells (Course Deal Owner), PMP vs every other course. */
function courseMix(){
  const gR=rangeG();
  const inRange=age=>age>=0&&(!gR||(age>=gR[0]&&age<=gR[1]));
  const ruleMaxAge=Math.round((TDAY.getTime()-Date.parse(SPEC.ruleStart+'T00:00:00'))/DAY);
  const pmpIdx=CDIM.indexOf('PMP');
  const agent={}; AM.forEach(o=>agent[o]={pmp:0,other:0});
  const monthM={}, dayM={};
  let teamPmp=0, teamOther=0;
  for(let i=0;i<NDEAL;i++){
    if(!custPassND[FT.dU[i]]||FT.dG[i]>ruleMaxAge)continue;
    const closer=ODIM[FT.dO[i]]; if(!AM.includes(closer))continue;
    const k=FT.dC[i]===pmpIdx?'pmp':'other';
    const mo=MONTHS[FT.dM[i]]; (monthM[mo]=monthM[mo]||{pmp:0,other:0})[k]++;

    if(inRange(FT.dG[i])){agent[closer][k]++; if(k==='pmp')teamPmp++; else teamOther++;}
  }
  const month=Object.keys(monthM).sort().map(mo=>({mo,...monthM[mo]}));
  const day=[]; for(let kk=29;kk>=0;kk--){const iso=isoOf(TDAY.getTime()-kk*DAY);day.push({d:iso,...(dayM[iso]||{pmp:0,other:0})});}
  return {agent,month,day,teamPmp,teamOther};
}

    return{l,n:s.length,r,ltv:s.length?Math.round(r/s.length):0,
      am:a.length,ot:o.length,amR:a.reduce((x,c)=>x+c.r,0),otR:o.reduce((x,c)=>x+c.r,0)};});

  f.forEach(x=>{h+=`<tr><td><span class="chip ${x.l==='1x'?'c-mut':x.l==='2x'?'c-warn':'c-gold'}">${x.l}</span></td>
   <td class="n" style="font-weight:600">${x.n.toLocaleString('en-IN')}</td><td class="n muted">${fpct(x.n,totC)}</td>
   <td class="n" style="font-weight:600">${inr(x.r)}</td><td class="n muted">${fpct(x.r,totR)}</td>
   <td class="n">${inrFull(x.ltv)}</td>
   <td class="n">${x.am.toLocaleString('en-IN')} <span class="faint">(${fpct(x.am,x.n)})</span></td>
   <td class="n muted">${x.ot.toLocaleString('en-IN')}</td></tr>`;});

   <td class="n">${inr(totR)}</td><td class="n">100%</td><td class="n">${totC?inrFull(totR/totC):'—'}</td>
   <td class="n">${f.reduce((a,x)=>a+x.am,0).toLocaleString('en-IN')}</td><td class="n">${f.reduce((a,x)=>a+x.ot,0).toLocaleString('en-IN')}</td></tr>`;
  h+=`</tbody></table></div></div>`;

  h+=`<div class="grid two" style="margin-top:14px">
   <div class="card panel"><h3>Customers by frequency</h3><div class="desc">The base is dominated by one-time buyers.</div>
   ${hbars(f.map(x=>({label:x.l,v:x.n,c:x.l==='1x'?'var(--d3)':'var(--d1)',disp:x.n.toLocaleString('en-IN')})),{lw:44,vw:64})}</div>
   <div class="card panel"><h3>Revenue by frequency</h3><div class="desc">Repeat buyers punch far above their headcount.</div>
   ${hbars(f.map(x=>({label:x.l,v:x.r,c:x.l==='1x'?'var(--d3)':'var(--d1)',disp:inr(x.r)})),{lw:44,vw:76})}</div></div>`;

  h+=`<div class="card panel" style="margin-top:14px"><h3>LTV climbs steeply with each repeat</h3>

   <div class="insight good">${f[0].ltv&&f[1].ltv?`<b>Getting a customer from 1 → 2 purchases doubles their value</b> (${inrFull(f[0].ltv)} → ${inrFull(f[1].ltv)}). ${f[4].ltv?`From 1 → 5+, it's ${(f[4].ltv/f[0].ltv).toFixed(1)}×.`:''}`:''}

function ownAgg(){
  const m={};
  for(const i of fDeal){const o=ODIM[FT.dO[i]];
    const x=m[o]=m[o]||{o,d:0,r:0,rep:0,repR:0,mature:0,am:AM.includes(o)?1:0,cu:0,dorm365:0};
    x.d++;x.r+=FT.dA[i];if(FT.dR[i]){x.rep++;x.repR+=FT.dA[i];}if(FT.dG[i]>=90)x.mature++;}
  fCU.forEach(c=>{const x=m[c.o];if(!x)return;x.cu++;if(c.dm>365)x.dorm365++;});
  return Object.values(m).map(x=>({...x,ts:x.d?Math.round(x.r/x.d):0,
    arpu:x.cu?Math.round(x.r/x.cu):0}));
}

function dormChip(d){const c=d<90?'c-good':d<365?'c-warn':d<730?'c-bad':'c-bad';return `<span class="chip ${c}">${fdays(d)}</span>`;}

function renderUpsell(){
  const paths={};
  fCU.forEach(c=>{const seq=c.cs.split('|');if(seq.length<2)return;
    for(let i=1;i<seq.length;i++){if(seq[i]===seq[0])continue;
      const k=seq[0]+'>'+seq[i];paths[k]=(paths[k]||0)+1;}});
  const allPaths=Object.entries(paths).map(([k,n])=>{const [a,bb]=k.split('>');return{a,b:bb,n};})
    .sort((x,y)=>y.n-x.n);
  const up=allPaths.filter(u=>u.a==='PMP').slice(0,12);

/* ---------- rep drawer ---------- */
/* The distinct fresh accounts behind an agent's Fresh Accounts count: accounts
   they own that hit a 90d / cert / revoke trigger inside the selected range,
   under the same rules as the Revenue-by-agent table. */
function freshAccountsFor(name){
  const gR=rangeG();
  const inRange=age=>age>=0&&(!gR||(age>=gR[0]&&age<=gR[1]));
  const ruleMaxAge=Math.round((TDAY.getTime()-Date.parse(SPEC.ruleStart+'T00:00:00'))/DAY);
  const set=new Set();
  for(let i=0;i<NDEAL;i++){                       // 90d handoffs
    if(!custPassND[FT.dU[i]]||CU[FT.dU[i]].o!==name)continue;
    if(FT.dG[i]>ruleMaxAge)continue;
    if(inRange(FT.dG[i]-90))set.add(FT.dU[i]);
  }
  CU.forEach((c,i)=>{                              // cert / revoke events
    if(!custPassND[i]||c.o!==name)return;
    if(c.ct&&inRange(c.ctd))set.add(i);
    if(c.ar&&inRange(c.ard))set.add(i);
  });
  return [...set].map(i=>CU[i]);
}
/* Monthly closings for an agent (as Course Deal Owner) from the rule start
   (Oct 2025) to the snapshot — the AM performance window. Every month in the
   window is present; months with no sales show zero, so recently-joined agents
   like Nivas still appear with an honest zero run before they started. */
function agentMonthlyPerf(name){
  const start=new Date(SPEC.ruleStart+'T00:00:00');
  const months=[]; let d=new Date(start.getFullYear(),start.getMonth(),1);
  const end=new Date(TDAY.getFullYear(),TDAY.getMonth(),1);
  while(d<=end){months.push(d.toISOString().slice(0,7));d=new Date(d.getFullYear(),d.getMonth()+1,1);}
  const m={}; months.forEach(mo=>m[mo]={mo,d:0,r:0});
  for(let i=0;i<NDEAL;i++){
    if(!custPassND[FT.dU[i]])continue;          // respects internal exclusion & non-date filters
    if(ODIM[FT.dO[i]]!==name)continue;          // agent as closer
    const mo=MONTHS[FT.dM[i]];
    if(m[mo]){m[mo].d++;m[mo].r+=FT.dA[i];}
  }
  return months.map(mo=>m[mo]);
}
function bookMonthly(idxSet){
  const start=new Date(SPEC.ruleStart+'T00:00:00');
  const months=[]; let d=new Date(start.getFullYear(),start.getMonth(),1);
  const end=new Date(TDAY.getFullYear(),TDAY.getMonth(),1);
  while(d<=end){months.push(d.toISOString().slice(0,7));d=new Date(d.getFullYear(),d.getMonth()+1,1);}
  const m={}; months.forEach(mo=>m[mo]={mo,d:0,r:0});
  for(let i=0;i<NDEAL;i++){
    if(!idxSet.has(FT.dU[i]))continue;              // deals belonging to these accounts
    const mo=MONTHS[FT.dM[i]]; if(m[mo]){m[mo].d++;m[mo].r+=FT.dA[i];}
  }
  return months.map(mo=>m[mo]);
}
/* For fresh accounts (owned by owners matching `match`), the age of the earliest
   trigger that put each one into the round-robin pool inside the selected window
   — a 90-day handoff, a dated certification, or a dated access revocation. */
function freshTriggerAges(match){
  const gR=rangeG();
  const inRange=age=>age>=0&&(!gR||(age>=gR[0]&&age<=gR[1]));
  const ruleMaxAge=Math.round((TDAY.getTime()-Date.parse(SPEC.ruleStart+'T00:00:00'))/DAY);
  const m=new Map();
  const put=(i,age)=>{if(age>=0&&(!m.has(i)||age>m.get(i)))m.set(i,age);};
  for(let i=0;i<NDEAL;i++){
    const ci=FT.dU[i];
    if(!custPassND[ci]||FT.dG[i]>ruleMaxAge||!match(CU[ci].o))continue;
    const h=FT.dG[i]-90; if(inRange(h))put(ci,h);
  }
  CU.forEach((c,i)=>{
    if(!custPassND[i]||!match(c.o))return;
    if(c.ct&&inRange(c.ctd))put(i,c.ctd);
    if(c.ar&&inRange(c.ard))put(i,c.ard);
  });
  return m;
}
/* Resales (deals closed AFTER the fresh trigger, since Oct 2025) from the accounts
   in ageMap, bucketed by month — the sales the fresh accounts actually generated. */
function resaleFromAges(ageMap){
  const start=new Date(SPEC.ruleStart+'T00:00:00');
  const months=[]; let d=new Date(start.getFullYear(),start.getMonth(),1);
  const end=new Date(TDAY.getFullYear(),TDAY.getMonth(),1);
  while(d<=end){months.push(d.toISOString().slice(0,7));d=new Date(d.getFullYear(),d.getMonth()+1,1);}
  const m={}; months.forEach(mo=>m[mo]={mo,d:0,r:0});
  const ruleMaxAge=Math.round((TDAY.getTime()-Date.parse(SPEC.ruleStart+'T00:00:00'))/DAY);
  for(let i=0;i<NDEAL;i++){
    const ci=FT.dU[i]; if(!ageMap.has(ci))continue;
    if(FT.dG[i]>ruleMaxAge||FT.dG[i]>=ageMap.get(ci))continue;   // resale = closed after the trigger
    const mo=MONTHS[FT.dM[i]]; if(m[mo]){m[mo].d++;m[mo].r+=FT.dA[i];}
  }
  return months.map(mo=>m[mo]);
}
function freshResale(name){const p=resaleFromAges(freshTriggerAges(o=>o===name));
  return {d:p.reduce((a,x)=>a+x.d,0),r:p.reduce((a,x)=>a+x.r,0),perf:p};}
function openRep(name,mode){

  else book=fCU.filter(c=>c.o===name);
  const rep=book.filter(c=>c.d>1),dorm=book.filter(c=>c.dm>=365),cert=book.filter(c=>c.ct),revk=book.filter(c=>revoked(c)),pmpOnly=book.filter(c=>c.cs==='PMP'&&c.d===1);

    }else{

  }else{

/* ---------- agent performance bars ---------- */
function monthLabel(ym){const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];const [y,m]=ym.split('-');return M[+m-1]+' '+y;}
function perfBars(perf){
  window.__perf=perf;
  const w=700,h=234,pad={l:10,r:10,t:34,b:40},iw=w-pad.l-pad.r,ih=h-pad.t-pad.b;
  const max=Math.max(1,...perf.map(x=>x.r));
  const n=perf.length,gw=iw/n,bw=Math.min(48,gw-12);
  let s=`<svg viewBox="0 0 ${w} ${h}">`;
  s+=`<line x1="${pad.l}" y1="${pad.t+ih}" x2="${w-pad.r}" y2="${pad.t+ih}" stroke="var(--line)"/>`;
  perf.forEach((d,i)=>{const bh=ih*d.r/max,x=pad.l+gw*i+(gw-bw)/2,y=pad.t+ih-bh;
    s+=`<rect class="perf-bar" data-i="${i}" x="${x}" y="${Math.min(y,pad.t+ih-2)}" width="${bw}" height="${Math.max(2,bh)}" rx="3" fill="var(--d1)" style="cursor:pointer" onclick="perfPick(${i})"><title>${monthLabel(d.mo)}: ${inr(d.r)} · ${d.d} deals</title></rect>
    <text x="${x+bw/2}" y="${y-7}" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--ink)">${d.r?inr(d.r):'—'}</text>
    <text x="${x+bw/2}" y="${h-13}" text-anchor="middle" font-size="9.5" fill="var(--muted)">${monthLabel(d.mo)}</text>`;});
  return s+`</svg>`;
}
function perfPick(i){
  const p=(window.__perf||[])[i]; if(!p)return;
  document.querySelectorAll('.perf-bar').forEach(e=>e.setAttribute('fill','var(--d1)'));
  const bar=document.querySelector('.perf-bar[data-i="'+i+'"]'); if(bar)bar.setAttribute('fill','var(--blue-dark)');
  const cap=document.getElementById('perfCap'); if(cap)cap.innerHTML=`<b>${monthLabel(p.mo)}</b> — ${inrFull(Math.round(p.r))} revenue · ${p.d} deal${p.d===1?'':'s'} closed`;
}

/* ---------- All Accounts table with Excel-style column filters ---------- */
let ACCT={rows:[],cols:[],filt:{},txt:{},sort:{k:'o',dir:1},name:''};
function acctDistinct(k){return [...new Set(ACCT.rows.map(r=>r[k]))].sort((a,b)=>String(a).localeCompare(String(b),undefined,{numeric:true}));}
function acctFiltered(){
  let rows=ACCT.rows.slice();
  for(const col of ACCT.cols){const k=col.k;
    if(col.cat){const set=ACCT.filt[k];if(set)rows=rows.filter(r=>set.has(r[k]));}
    else{const q=(ACCT.txt[k]||'').toLowerCase();if(q)rows=rows.filter(r=>String(r[k]).toLowerCase().includes(q));}}
  const s=ACCT.sort;
  rows.sort((a,b)=>s.dir*String(a[s.k]||'').localeCompare(String(b[s.k]||''),undefined,{numeric:true}));
  return rows;
}
function acctRender(){
  const el=document.getElementById('acctTbl');if(!el)return;
  const rows=acctFiltered();
  const head=ACCT.cols.map(col=>{
    const active=(col.cat&&ACCT.filt[col.k])||(!col.cat&&ACCT.txt[col.k]);
    const ar=ACCT.sort.k===col.k?(ACCT.sort.dir>0?' ▲':' ▼'):'';
    return `<th class="acct-th"><span class="acct-sort" onclick="acctSort('${col.k}')">${col.label}${ar}</span><button class="acct-fbtn${active?' on':''}" title="Filter" onclick="event.stopPropagation();acctFilterPop('${col.k}',this)">⏷</button></th>`;
  }).join('');
  const yn=v=>v==='Yes'?'<span class="chip c-brand">Yes</span>':'<span class="chip c-mut">No</span>';
  const ynCols=new Set(['resold','revoked','certified']);
  const body=rows.slice(0,600).map(r=>`<tr>${ACCT.cols.map(col=>{
     const v=r[col.k];
     if(col.k==='e')return `<td class="muted">${esc(v)}</td>`;
     if(ynCols.has(col.k))return `<td>${yn(v)}</td>`;
     return `<td>${esc(v)||'—'}</td>`;
   }).join('')}</tr>`).join('');
  el.innerHTML=`<div class="acct-meta">${rows.length.toLocaleString('en-IN')} of ${ACCT.rows.length.toLocaleString('en-IN')} accounts${rows.length!==ACCT.rows.length?` · <button class="acct-reset" onclick="acctResetAll()">reset filters</button>`:''}</div>
   <div class="tbl-wrap acct-wrap" style="max-height:360px"><table class="acct-table"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>
   ${rows.length>600?`<div class="hint">Showing first 600 — refine filters or export for the full set.</div>`:''}`;
}
function acctSort(k){if(ACCT.sort.k===k)ACCT.sort.dir*=-1;else ACCT.sort={k,dir:1};acctRender();}
function acctResetAll(){ACCT.filt={};ACCT.txt={};acctRender();}
function acctText(k,v){if(v)ACCT.txt[k]=v;else delete ACCT.txt[k];acctRender();}
function acctToggle(k,val){
  const all=acctDistinct(k);
  if(!ACCT.filt[k])ACCT.filt[k]=new Set(all);
  const set=ACCT.filt[k];
  set.has(val)?set.delete(val):set.add(val);
  if(set.size===all.length)delete ACCT.filt[k];
  acctRender();
}
function acctSelectAll(k,on){
  if(on)delete ACCT.filt[k];else ACCT.filt[k]=new Set();
  const box=document.getElementById('acctOpts');if(box)box.querySelectorAll('input').forEach(i=>i.checked=on);

function acctPopSearch(q){const box=document.getElementById('acctOpts');if(!box)return;q=q.toLowerCase();

function closeAcctPop(){const p=document.getElementById('acctPop');if(p)p.remove();document.removeEventListener('click',closeAcctPop);}
function acctFilterPop(k,btn){
  const open=document.getElementById('acctPop');closeAcctPop();
  if(open&&open.getAttribute('data-k')===k)return;   // toggle off
  const col=ACCT.cols.find(c=>c.k===k);
  const pop=document.createElement('div');pop.className='acct-pop';pop.id='acctPop';pop.setAttribute('data-k',k);
  if(col.cat){
    const vals=acctDistinct(k);const sel=ACCT.filt[k];
    pop.innerHTML=`<input class="fsrch" placeholder="Search ${esc(col.label.toLowerCase())}" oninput="acctPopSearch(this.value)">
      <div class="acct-pop-act"><button onclick="acctSelectAll('${k}',true)">Select all</button><button onclick="acctSelectAll('${k}',false)">Clear</button></div>
      <div class="acct-opts" id="acctOpts">`+vals.map(v=>`<label class="acct-opt" data-l="${esc(String(v)).toLowerCase()}"><input type="checkbox" ${(!sel||sel.has(v))?'checked':''} onchange="acctToggle('${k}',this.value)" value="${esc(String(v))}"><span>${esc(String(v))||'(blank)'}</span></label>`).join('')+`</div>`;
  }else{
    pop.innerHTML=`<input class="fsrch" placeholder="Filter ${esc(col.label.toLowerCase())}" value="${esc(ACCT.txt[k]||'')}" oninput="acctText('${k}',this.value)">`;

  const rect=btn.getBoundingClientRect();
  pop.style.top=(rect.bottom+4)+'px';
  pop.style.left=Math.max(8,Math.min(rect.left-180,window.innerWidth-268))+'px';

function exportAcct(){

    [ACCT.cols.map(c=>c.label), ...rows.map(r=>ACCT.cols.map(c=>r[c.k]))]);

/* ---- cross-filtering slicers ----
   Each slicer's options are derived from the data narrowed by every OTHER
   filter, so selecting Team=AM leaves only AM owners in the Owner list. */
function tally(key,valueOf){
  const m=new Map();
  for(const c of CU){ if(!passExcept(c,key))continue;
    const v=valueOf(c);
    if(Array.isArray(v)){for(const x of v)m.set(x,(m.get(x)||0)+1);}
    else m.set(v,(m.get(v)||0)+1);}
  return m;
}
function slicerHTML(s){
  let opts=[];
  const fx=typeof s.fixed==='function'?s.fixed():s.fixed;
  if(fx){
    opts=fx.map(([v,l])=>{
      if(v==='all')return{v,l,n:null};
      return{v,l,n:s.count?s.count(v):null};});
  }else{
    const m=s.dyn();
    let list=[...m.entries()].sort((a,b)=>b[1]-a[1]||String(a[0]).localeCompare(String(b[0])));
    if(s.cap)list=list.slice(0,s.cap);
    opts=[{v:'all',l:'All',n:null},
      ...list.map(([v,n])=>({v:String(v),l:String(v),n}))];
  }
  return opts.map(o=>`<option value="${esc(o.v)}"${F[s.k]===o.v?' selected':''}>${esc(o.l)}${o.n!=null?` (${o.n.toLocaleString('en-IN')})`:''}</option>`).join('');
}
/* The filter the user just touched always wins. Any OTHER selection that the
   new pick made impossible falls back to All. Loops because clearing one can
   cascade into another. */
function reconcile(changedKey){
  for(let i=0;i<3;i++){
    let changed=false;
    for(const s of activeSlicers()){
      if(s.k===changedKey||s.input)continue;
      if(F[s.k]==='all')continue;
      let ok=true;
      if(s.dyn)ok=s.dyn().has(F[s.k]);
      else if(s.count)ok=s.count(F[s.k])>0;
      if(!ok){F[s.k]='all';changed=true;}
    }
    if(!changed)break;
  }
}

/* RFC-4180-ish parser: handles quoted fields containing commas and newlines. */
function parseCSV(text){
  if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);      // strip BOM
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){
      if(ch==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; }
      else cell+=ch;
    }else{
      if(ch==='"')q=true;
      else if(ch===','){row.push(cell);cell='';}
      else if(ch==='\n'){row.push(cell);cell='';rows.push(row);row=[];}
      else if(ch!=='\r')cell+=ch;
    }
  }
  if(cell!==''||row.length){row.push(cell);rows.push(row);}
  return rows;
}
/* dd/MM/yyyy, optionally followed by a time. Returns UTC ms or null. */
function pdate(s){
  if(!s)return null;
  const m=String(s).trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(!m)return null;
  const d=+m[1],mo=+m[2],y=+m[3];
  if(mo<1||mo>12||d<1||d>31)return null;
  return Date.UTC(y,mo-1,d);
}
const REGION_OF=(()=>{const m={};for(const r in SPEC.regions)SPEC.regions[r].forEach(c=>m[c]=r);return m;})();
const regionOf=c=>REGION_OF[c]||SPEC.regionOther;
const isoOf=ms=>new Date(ms).toISOString().slice(0,10);
const ymOf=ms=>new Date(ms).toISOString().slice(0,7);

function validate(rows){
  if(rows.length<2)return{ok:false,msg:'That file has no data rows.'};
  const hdr=rows[0].map(h=>h.trim());
  const has=c=>hdr.includes(c)||(c==='Owner'&&hdr.includes('Lead Owner'));
  const missing=SPEC.required.filter(c=>!has(c));
  if(missing.length)return{ok:false,msg:`Missing column${missing.length>1?'s':''}: ${missing.join(', ')}`,
    detail:`Found: ${hdr.join(', ')}`};
  return{ok:true,hdr};
}

/* rows -> model. Mirrors the agreed grain: customer = unique email, deal = row. */
function buildModel(rows,amList){
  const hdr=rows[0].map(h=>h.trim());
  const ix={};hdr.forEach((h,i)=>ix[h]=i);
  // CRM renamed "Lead Owner" to "Owner" — accept either header interchangeably.
  if(ix['Owner']==null&&ix['Lead Owner']!=null)ix['Owner']=ix['Lead Owner'];
  if(ix['Lead Owner']==null&&ix['Owner']!=null)ix['Lead Owner']=ix['Owner'];
  // CRM renamed "Course Deal Owner" (who closed the deal) to "Owner (Course Deals)".
  if(ix['Course Deal Owner']==null&&ix['Owner (Course Deals)']!=null)ix['Course Deal Owner']=ix['Owner (Course Deals)'];
  const get=(r,c)=>{const i=ix[c];return i==null?'':(r[i]==null?'':String(r[i]).trim());};

  const deals=[];const skip={noDate:0,noEmail:0,noAmount:0,notWon:0,value:0,names:[]};
  for(let i=1;i<rows.length;i++){
    const r=rows[i];
    if(!r||r.length<3||r.every(x=>!x||!String(x).trim()))continue;
    const cd=pdate(get(r,'Closing Date'));
    const email=get(r,'Email').toLowerCase();
    const amt0=parseFloat(String(get(r,'Amount')).replace(/[^0-9.\-]/g,''));
    const won=get(r,'Stage').startsWith(SPEC.saleStagePrefix);
    // A sale = Closed Won AND a real amount. Plus an email, which is the only
    // key that can attribute it to an account.
    if(cd===null||!email||email==='nan'||email==='n/a'||!won||!isFinite(amt0)||amt0<=0){
      if(!won)skip.notWon++;
      else if(!isFinite(amt0)||amt0<=0)skip.noAmount++;
      else if(cd===null)skip.noDate++;
      else skip.noEmail++;
      if(isFinite(amt0))skip.value+=amt0;
      if(skip.names.length<6)skip.names.push(get(r,'Full Name')||'(no name)');
      continue;}
    const amt=parseFloat(String(get(r,'Amount')).replace(/[^0-9.\-]/g,''));
    deals.push({e:email,cd,
      o:get(r,'Owner')||'(unassigned)',
      dOwn:get(r,SPEC.dealOwnerCol)||get(r,'Owner')||'(unassigned)',
      n:get(r,'Full Name'),
      p:get(r,'Phone'),
      co:(get(r,'Country').split(' --- ')[0]||'Unknown').slice(0,20),
      rg:regionOf((get(r,'Country').split(' --- ')[0]||'Unknown').trim()),
      c:get(r,'Course Deal Name')||'(none)',
      a:amt0,
      src:get(r,'Source')||'(not set)',
      certName:get(r,'Last Certified'),
      certDate:pdate(get(r,'Last Certified Date')),
      arv:/^(true|yes|1)$/i.test(get(r,'Access Revoked')),
      arCourse:get(r,'Last Access Revoked'),
      arDate:pdate(get(r,'Last Access Revoked Date'))});
  }
  if(!deals.length)return{ok:false,msg:'No rows had a valid Closing Date and Email.'};
  deals.sort((x,y)=>x.cd-y.cd);

  // Report snapshot = latest closing date, but ignore stray future-dated installments.
  // A closing date more than ~10 days past the newest CREATED record is scheduled in the
  // future (e.g. an instalment), not part of the pulled snapshot — so it must not define "as of".
  let maxCreated=0;
  for(let i=1;i<rows.length;i++){const t=pdate(get(rows[i],'Created Time')); if(t!=null&&t>maxCreated)maxCreated=t;}
  let today=deals[deals.length-1].cd;
  if(maxCreated && today-maxCreated>10*DAY){
    let t=0; for(const d of deals){ if(d.cd<=maxCreated && d.cd>t) t=d.cd; }
    today=t||maxCreated;
  }
  const firstBuy={};
  deals.forEach(d=>{if(firstBuy[d.e]==null)firstBuy[d.e]=d.cd;});
  deals.forEach(d=>d.rep=d.cd>firstBuy[d.e]?1:0);

  const AMset=new Set(amList);
  const byCust={};
  deals.forEach(d=>{(byCust[d.e]=byCust[d.e]||[]).push(d);});
  const custKeys=Object.keys(byCust).sort();
  const cust=custKeys.map(e=>{
    const g=byCust[e];
    const last=g[g.length-1], first=g[0];
    const courses=[];g.forEach(d=>{if(!courses.includes(d.c))courses.push(d.c);});
    const rev=g.reduce((a,d)=>a+d.a,0);
    // certification is a customer attribute repeated across their deals.
    // 630 rows carry a date but no name, so treat either as certified.
    let cDate=null,cName='';
    g.forEach(d=>{if(d.certDate!=null&&(cDate==null||d.certDate>cDate))cDate=d.certDate;
                  if(d.certName&&!cName)cName=d.certName;});
    const certd=(cDate!=null||!!cName)?1:0;
    // Access revocation is an account attribute in the export: every deal for a
    // customer carries the same flag. Take the max and the latest date.
    let arv=false,arDate=null,arCourse='';
    g.forEach(d=>{if(d.arv)arv=true;
      if(d.arDate!=null&&(arDate==null||d.arDate>arDate))arDate=d.arDate;
      if(d.arCourse&&!arCourse)arCourse=d.arCourse;});
    return{n:(last.n||'—').slice(0,38),e:e.slice(0,46),p:last.p||'',o:last.o,
      c:last.co,lc:last.c||'(none)',d:g.length,r:rev,
      f:isoOf(first.cd).slice(2),l:isoOf(last.cd).slice(2),
      ag:Math.round((today-first.cd)/DAY),
      dm:Math.round((today-last.cd)/DAY),
      cs:courses.slice(0,5).join('|'),
      ct:certd,
      ar:arv?1:0,
      ard:arDate!=null?Math.round((today-arDate)/DAY):-1,
      arc:arCourse||'',
      ctd:cDate!=null?Math.round((today-cDate)/DAY):-1,
      ctn:cName||(certd?'(unnamed)':''),
      int:(e.endsWith(SPEC.internalDomain)&&!SPEC.internalAllow.includes(e))?1:0,
      src:first.src,
      rg:last.rg,
      am:AMset.has(last.o)?1:0,
      g2:g.length>1?Math.round((g[1].cd-g[0].cd)/DAY):-1};
  });
  const cIdx={};custKeys.forEach((e,i)=>cIdx[e]=i);

  const months=[...new Set(deals.map(d=>ymOf(d.cd)))].sort();
  const owners=[...new Set(deals.map(d=>d.dOwn))].sort();        // closers
  const leadOwners=[...new Set(deals.map(d=>d.o))].sort();       // book holders
  const courses=[...new Set(deals.map(d=>d.c))].sort();
  const mI={},oI={},cI={};
  months.forEach((m,i)=>mI[m]=i);owners.forEach((o,i)=>oI[o]=i);courses.forEach((c,i)=>cI[c]=i);

  const N=deals.length;
  const fact={dM:new Array(N),dO:new Array(N),dC:new Array(N),dA:new Array(N),
              dR:new Array(N),dU:new Array(N),dG:new Array(N)};
  deals.forEach((d,i)=>{
    fact.dM[i]=mI[ymOf(d.cd)];fact.dO[i]=oI[d.dOwn];fact.dC[i]=cI[d.c];
    fact.dA[i]=d.a;fact.dR[i]=d.rep;fact.dU[i]=cIdx[d.e];
    fact.dG[i]=Math.round((today-d.cd)/DAY);
  });
  const countries=[...new Set(cust.map(c=>c.c))].sort();
  const sources=[...new Set(cust.map(c=>c.src))].sort();
  const regions=SPEC.regionOrder.filter(r=>cust.some(c=>c.rg===r));
  const unmapped=[...new Set(cust.filter(c=>c.rg===SPEC.regionOther).map(c=>c.c))].sort();
  const otherN=cust.filter(c=>c.rg===SPEC.regionOther).length;
  const otherRev=cust.filter(c=>c.rg===SPEC.regionOther).reduce((a,c)=>a+c.r,0);
  const intern=cust.filter(c=>c.int);
  const internal={n:intern.length,deals:intern.reduce((a,c)=>a+c.d,0),
    rev:intern.reduce((a,c)=>a+c.r,0),top:intern.slice().sort((a,b)=>b.d-a.d).slice(0,6).map(c=>({e:c.e,d:c.d,r:c.r}))};
  const revd=cust.filter(c=>c.ar);
  const revDates=revd.filter(c=>c.ard>=0).map(c=>c.ard);
  const revCov=revDates.length?{n:revd.length,dated:revDates.length,
    min:isoOf(today-Math.max(...revDates)*DAY),max:isoOf(today-Math.min(...revDates)*DAY),
    named:revd.filter(c=>c.arc).length}:null;
  const certDates=cust.filter(c=>c.ctd>=0).map(c=>c.ctd);
  const certCov=certDates.length?{min:isoOf(today-Math.max(...certDates)*DAY),max:isoOf(today-Math.min(...certDates)*DAY),n:certDates.length}:null;
  return{ok:true,skip,model:{
    meta:{today:isoOf(today),AM:amList.slice(),nCust:cust.length,nDeals:N,
      totalRev:deals.reduce((a,d)=>a+d.a,0),courses,owners,leadOwners,countries,sources,regions,
      regionOther:{n:otherN,rev:otherRev,countries:unmapped},
      internal,certCov,revCov},
    cust,months,ownersD:owners,coursesD:courses,fact}};
}

  el.className='gate-msg '+kind;

function handleFile(file){
  if(!file)return;
  if(!/\.csv$/i.test(file.name)){gateMsg('bad','That needs to be a .csv file.',`You picked ${file.name}`);return;}
  gateMsg('busy','Reading '+file.name+'…','');
  const fr=new FileReader();
  fr.onerror=()=>gateMsg('bad','Could not read that file.','Try re-exporting it from Zoho.');
  fr.onload=()=>{
    setTimeout(()=>{
      try{
        const rows=parseCSV(fr.result);
        const v=validate(rows);
        if(!v.ok){gateMsg('bad',v.msg,v.detail);return;}
        const roster=loadRoster()||SPEC.defaultAM;
        const built=buildModel(rows,roster);
        if(!built.ok){gateMsg('bad',built.msg,'');return;}
        // roster names that aren't in this export
        const miss=roster.filter(r=>!built.model.meta.owners.includes(r));
        LAST_ROWS=rows;LAST_SKIP=built.skip;
        mount(built.model);
        const notes=[];
        const sk=built.skip, n=sk.noDate+sk.noEmail+(sk.noAmount||0)+(sk.notWon||0);
        if(n)notes.push(`${n.toLocaleString('en-IN')} row${n>1?'s':''} skipped (${inr(sk.value)})`);
        if(miss.length)notes.push(`AM roster not in report: ${miss.join(', ')}`);
        if(notes.length)toast(notes.join(' · ')+' — see Data notes');
      }catch(err){gateMsg('bad','That file could not be parsed.',String(err.message||err));}
    },30);
  };
  fr.readAsText(file);
}

}
function applyRoster(){
  const picked=[...document.querySelectorAll('.rosrow input:checked')].map(i=>i.value);
  saveRoster(picked);
  closeDrawer();
  if(LAST_ROWS){const b=buildModel(LAST_ROWS,picked);if(b.ok){mount(b.model);toast('AM roster updated — '+picked.length+' member'+(picked.length===1?'':'s')+'.');}}
}
function resetRoster(){saveRoster(SPEC.defaultAM);closeDrawer();
  if(LAST_ROWS){const b=buildModel(LAST_ROWS,SPEC.defaultAM);if(b.ok){mount(b.model);toast('AM roster reset to default.');}}}

function initGate(){
  const dz=document.getElementById('drop'), fi=document.getElementById('gateFile');
  dz.onclick=()=>fi.click();
  fi.onchange=()=>handleFile(fi.files[0]);
  ['dragenter','dragover'].forEach(e=>dz.addEventListener(e,ev=>{ev.preventDefault();dz.classList.add('over');}));
  ['dragleave','drop'].forEach(e=>dz.addEventListener(e,ev=>{ev.preventDefault();dz.classList.remove('over');}));
  dz.addEventListener('drop',ev=>handleFile(ev.dataTransfer.files[0]));
  document.getElementById('gateCols').textContent=SPEC.required.join(' · ');
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();});
}
initGate();
</script>
</body>
</html>
